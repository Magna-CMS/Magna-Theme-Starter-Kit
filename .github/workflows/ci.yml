name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tools-and-theme:
    name: Tools and Starter theme (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none

      - name: Syntax-check the tools
        run: for f in tools/*.php; do php -l "$f"; done

      - name: Lint the Starter theme
        run: php tools/theme-lint.php starter-theme --strict

      - name: The linter refuses a broken theme
        run: |
          cp -r starter-theme "$RUNNER_TEMP/broken"
          printf '<scr''ipt>alert(1)</scr''ipt>\n' >> "$RUNNER_TEMP/broken/views/blocks/callout.blade.php"
          if php tools/theme-lint.php "$RUNNER_TEMP/broken"; then
            echo "theme-lint accepted a block view with a script element" >&2
            exit 1
          fi

      - name: Scaffold a theme and lint it
        run: |
          php tools/new-theme.php ci/sample "$RUNNER_TEMP/sample" --display="CI Sample"
          php tools/theme-lint.php "$RUNNER_TEMP/sample" --strict
          ! grep -rn 'starter-' "$RUNNER_TEMP/sample/views" "$RUNNER_TEMP/sample/starter"

      - name: Package the Starter theme
        run: |
          php tools/package.php starter-theme --out="$RUNNER_TEMP/dist"
          unzip -l "$RUNNER_TEMP"/dist/*.zip
          unzip -l "$RUNNER_TEMP"/dist/*.zip | grep -q ' starter/theme.json$'

  schemas:
    name: JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate the Starter theme against the schemas
        run: |
          AJV="npx --yes -p ajv-cli@5.0.0 -p ajv-formats@3.0.1 ajv validate --spec=draft2020 --strict=false -c ajv-formats"
          $AJV -s schemas/theme.schema.json -d starter-theme/theme.json
          $AJV -s schemas/tokens.schema.json -d starter-theme/tokens.json
          $AJV -s schemas/site-kit.schema.json -d "starter-theme/starter/*.json"
