name: Docs gap
description: Something in the guide was missing, unclear, or didn't match what you saw.
labels: ["docs-gap"]
body:
  - type: input
    id: chapter
    attributes:
      label: Chapter or file
      placeholder: docs/05-layout.md
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the guide said (or didn't say)
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Commands, output, screenshots.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Magna CMS 1.7.0, Magna Pages 0.6.0-alpha
    validations:
      required: true
